spring:
  application.name: bank-ease
  profiles.active: ${SPRING_PROFILES_ACTIVE:mock}
  jackson.serialization.write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
---
spring:
  config.activate.on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bankease?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:bankease}
    password: ${DB_PASSWORD:bankease}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
---
spring:
  config.activate.on-profile: mock
  datasource:
    url: jdbc:h2:mem:bankease
    driver-class-name: org.h2.Driver
  jpa:
    hibernate.ddl-auto: none
